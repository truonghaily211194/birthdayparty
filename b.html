<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blow Birthday Candle</title>
<meta property="og:title" content="🎂 Blow Birthday Candle">
<meta property="og:description" content="Open the link to blow out the candles!">
<style>
  :root { color-scheme: light dark; --fg:#2b2530; --fg2:#6a6070; --card:#ffffffcc; --accent:#5c82ff; --accent2:#8b5cff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; color: var(--fg);
         background: linear-gradient(180deg, var(--bg1, #f8e0e6), var(--bg2, #edc5cf)); display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 24px 20px; }
  .card { width: 100%; max-width: 420px; background: var(--card); backdrop-filter: blur(16px); border-radius: 28px; padding: 24px 22px 22px; text-align:center;
          box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .title { font-family: "Great Vibes", "Zapfino", "Snell Roundhand", cursive; font-size: 40px; line-height: 1.15; color: var(--title, #b8730a); margin: 4px 0 0; }
  .name { font-size: 26px; font-weight: 800; letter-spacing: .5px; margin: 6px 0 14px; word-break: break-word; }
  .cake { width: 100%; max-height: 260px; object-fit: contain; display:block; margin: 0 auto 10px; filter: drop-shadow(0 12px 18px rgba(0,0,0,.18)); }
  .from { display:inline-block; font-size: 13px; font-weight: 700; color: var(--fg2); background: rgba(0,0,0,.05); border-radius: 12px; padding: 5px 10px; margin-bottom: 8px; }
  .msg { font-size: 15px; color: var(--fg); margin: 0 0 16px; white-space: pre-line; word-break: break-word; }
  .btn { display:block; width:100%; border:0; border-radius: 16px; padding: 15px 16px; font: inherit; font-weight: 800; font-size: 17px; cursor:pointer; text-decoration:none; margin-top: 10px; }
  .primary { color:#fff; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 10px 20px rgba(139,92,255,.35); }
  .secondary { color: var(--fg); background: rgba(0,0,0,.06); }
  .hint { font-size: 12px; color: var(--fg2); margin-top: 14px; }
  .dark { --fg:#f2eef0; --fg2:#c9bfc3; --card:#2f2a2ecc; --title:#e69700; }
  .dark .secondary { background: rgba(255,255,255,.12); }
  .dark .from { background: rgba(255,255,255,.1); }
  footer { margin-top: 18px; font-size: 12px; color: var(--fg2); }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="card">
  <img id="cake" class="cake" alt="" hidden>
  <div class="title" id="title">Happy Birthday</div>
  <div class="name" id="name"></div>
  <div class="from" id="from" hidden></div>
  <p class="msg" id="msg" hidden></p>
  <a class="btn primary" id="open" href="#">Open in app</a>
  <a class="btn secondary" id="store" href="https://apps.apple.com/app/id6502148743" target="_blank" rel="noopener">Get the app</a>
  <div class="hint" id="hint"></div>
</div>
<footer><a id="pp" href="privacy.html">Privacy Policy</a> · <a id="tm" href="terms.html">Terms of Use</a></footer>
<script>
// Trang cầu nối: dữ liệu quà nằm hết trong query (?n=…&c=…), không có server.
// Bấm "Mở trong app" → blowcandle://gift?<query gốc>; chưa cài → nút tải app.
const APP_STORE = "https://apps.apple.com/app/id6502148743";
const PLAY_STORE = "https://play.google.com/store/apps/details?id=ly.truong.blow_birthday_candle";
const T = {
 en:{open:"Open in the app & blow the candles",store:"Get the app",hint:"Already have the app? The candles are waiting for you inside.",from:"A birthday wish from {from}",forYou:"A birthday wish for you",pp:"Privacy Policy",tm:"Terms of Use"},
 vi:{open:"Mở trong app & thổi nến",store:"Tải app",hint:"Đã cài app? Nến đang chờ bạn thổi trong app đó.",from:"Lời chúc sinh nhật từ {from}",forYou:"Lời chúc sinh nhật dành cho bạn",pp:"Chính sách bảo mật",tm:"Điều khoản sử dụng"},
 ja:{open:"アプリで開いてろうそくを吹き消す",store:"アプリを入手",hint:"アプリをお持ちですか？中でろうそくが待っています。",from:"{from}さんからのお祝い",forYou:"あなたへのお誕生日のお祝い",pp:"プライバシーポリシー",tm:"利用規約"},
 ko:{open:"앱에서 열고 촛불 불기",store:"앱 받기",hint:"앱이 있나요? 촛불이 앱 안에서 기다리고 있어요.",from:"{from}님의 생일 축하",forYou:"당신을 위한 생일 축하",pp:"개인정보 처리방침",tm:"이용약관"},
 zh:{open:"在应用中打开并吹灭蜡烛",store:"获取应用",hint:"已经安装了？蜡烛正在应用里等你。",from:"来自 {from} 的生日祝福",forYou:"送给你的生日祝福",pp:"隐私政策",tm:"使用条款"},
 es:{open:"Abrir en la app y soplar las velas",store:"Descargar la app",hint:"¿Ya tienes la app? Las velas te esperan dentro.",from:"Un deseo de cumpleaños de {from}",forYou:"Un deseo de cumpleaños para ti",pp:"Política de privacidad",tm:"Términos de uso"},
 pt:{open:"Abrir no app e apagar as velas",store:"Baixar o app",hint:"Já tem o app? As velas estão esperando lá dentro.",from:"Um desejo de aniversário de {from}",forYou:"Um desejo de aniversário para você",pp:"Política de Privacidade",tm:"Termos de Uso"},
 fr:{open:"Ouvrir dans l'app et souffler les bougies",store:"Télécharger l'app",hint:"Vous avez déjà l'app ? Les bougies vous attendent dedans.",from:"Un vœu d'anniversaire de {from}",forYou:"Un vœu d'anniversaire pour toi",pp:"Politique de confidentialité",tm:"Conditions d'utilisation"},
 de:{open:"In der App öffnen & Kerzen auspusten",store:"App laden",hint:"App schon installiert? Die Kerzen warten dort auf dich.",from:"Ein Geburtstagsgruß von {from}",forYou:"Ein Geburtstagsgruß für dich",pp:"Datenschutzerklärung",tm:"Nutzungsbedingungen"},
 ru:{open:"Открыть в приложении и задуть свечи",store:"Скачать приложение",hint:"Уже есть приложение? Свечи ждут тебя внутри.",from:"Поздравление от {from}",forYou:"Поздравление с днём рождения для тебя",pp:"Политика конфиденциальности",tm:"Условия использования"},
 id:{open:"Buka di aplikasi & tiup lilin",store:"Unduh aplikasi",hint:"Sudah punya aplikasinya? Lilin menunggumu di dalam.",from:"Ucapan ulang tahun dari {from}",forYou:"Ucapan ulang tahun untukmu",pp:"Kebijakan Privasi",tm:"Ketentuan Penggunaan"},
 th:{open:"เปิดในแอปแล้วเป่าเทียน",store:"ดาวน์โหลดแอป",hint:"มีแอปแล้ว? เทียนรอคุณอยู่ในแอป",from:"คำอวยพรวันเกิดจาก {from}",forYou:"คำอวยพรวันเกิดสำหรับคุณ",pp:"นโยบายความเป็นส่วนตัว",tm:"ข้อกำหนดการใช้งาน"},
};
const q = new URLSearchParams(location.search);
// Link gói: ?g=base64url(utf8("tên\tngười gửi\tlời chúc\tbánh")) → bung ra n/f/msg/c (link cũ ?n=… vẫn chạy)
if (q.get("g")) { try {
  const b64 = q.get("g").replace(/-/g,"+").replace(/_/g,"/");
  const bytes = Uint8Array.from(atob(b64 + "=".repeat((4 - b64.length % 4) % 4)), ch => ch.charCodeAt(0));
  const [n,f,msg,c] = new TextDecoder().decode(bytes).split("\t");
  if (n) q.set("n", n); if (f) q.set("f", f); if (msg) q.set("msg", msg); if (c) q.set("c", c);
} catch (e) {} }
function pickLang(){ const c=[q.get("lang"),...(navigator.languages||[navigator.language])].filter(Boolean); for(const x of c){const k=x.toLowerCase().split(/[-_]/)[0]; if(T[k]) return k;} return "en"; }
const k = pickLang(), t = T[k]; document.documentElement.lang = k;
const name = (q.get("n")||"").slice(0,20), from=(q.get("f")||"").slice(0,20), msg=(q.get("msg")||"").slice(0,140), cake=q.get("c")||"cake", title=(q.get("t")||"").slice(0,40);
document.getElementById("title").textContent = title || "Happy Birthday";
document.getElementById("name").textContent = name;
const fromEl=document.getElementById("from"); fromEl.textContent = from ? t.from.replace("{from}", from) : t.forYou; fromEl.hidden=false;
if (msg) { const m=document.getElementById("msg"); m.textContent=msg; m.hidden=false; }
document.getElementById("hint").textContent = t.hint;
document.getElementById("pp").textContent = t.pp; document.getElementById("pp").href = "privacy.html?lang="+k;
document.getElementById("tm").textContent = t.tm; document.getElementById("tm").href = "terms.html?lang="+k;
// Ảnh bánh + nền theo bánh (docs/cakes/<id>.webp, index.json)
const img=document.getElementById("cake");
img.onerror = () => { img.src = "cakes/cake.webp"; img.onerror = null; };
img.src = "cakes/" + encodeURIComponent(cake) + ".webp"; img.hidden=false;
fetch("cakes/index.json").then(r=>r.json()).then(m=>{
  const bg = (m[cake]||m["cake"]||{}).bg; if(!bg) return;
  document.documentElement.style.setProperty("--bg1", bg.top); document.documentElement.style.setProperty("--bg2", bg.bottom);
  const c=bg.top.replace("#",""); const lum=(parseInt(c.substr(0,2),16)*299+parseInt(c.substr(2,2),16)*587+parseInt(c.substr(4,2),16)*114)/255000;
  if (lum < 0.45) document.body.classList.add("dark");
}).catch(()=>{});
// Link mở app: chỉ cần gói g (app tự giải mã); link cũ thì truyền query gốc
const scheme = "blowcandle://gift?" + (q.get("g") ? "g=" + encodeURIComponent(q.get("g")) : q.toString());
const open=document.getElementById("open"); open.textContent=t.open; open.href=scheme;
const isAndroid=/android/i.test(navigator.userAgent), isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const store=document.getElementById("store"); store.textContent=t.store; if(isAndroid) store.href=PLAY_STORE;
// Trên điện thoại: tự thử mở app một lần khi trang vừa tải
if (isIOS || isAndroid) { setTimeout(()=>{ location.href = scheme; }, 400); }
</script>
</body>
</html>
