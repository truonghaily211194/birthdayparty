 ["2. Licence", `Nous vous accordons une licence personnelle, non exclusive, non transférable et révocable pour utiliser l'App sur des appareils que vous possédez ou contrôlez, à des fins personnelles et non commerciales, conformément aux conditions de l'App Store ou de Google Play.`],
 ["3. Achat intégré", `« Supprimer les pubs » est un achat unique non consommable qui supprime toute publicité et débloque tous les gâteaux. Il est traité par Apple ou Google selon leurs conditions ; les remboursements relèvent d'eux. Il peut être restauré sur d'autres appareils avec le même compte via « Restaurer les achats ».`],
 ["4. Publicité et pubs récompensées", `La version gratuite affiche des publicités Google AdMob. Certains gâteaux peuvent être utilisés en regardant une pub récompensée ; le gâteau reste débloqué tant qu'il est sélectionné et se verrouille à nouveau si vous en changez. La disponibilité des publicités n'est pas garantie.`],
 ["5. Utilisation acceptable", `Vous ne pouvez pas copier, modifier, distribuer, décompiler ou revendre l'App ou son contenu, l'utiliser de manière illicite, ni perturber ses mécanismes de publicité et d'achat.`],
 ["6. Contenu et propriété intellectuelle", `L'App, ses illustrations, modèles de gâteaux, polices et musiques appartiennent à Ly Truong ou sont sous licence. Les noms que vous saisissez restent les vôtres et sur votre appareil.`],
 ["7. Exclusion de garantie", `L'App est fournie « telle quelle » et « selon disponibilité », sans garantie. La détection du souffle dépend du micro et de l'environnement et peut ne pas toujours fonctionner comme prévu.`],
 ["8. Limitation de responsabilité", `Dans la mesure permise par la loi, Ly Truong n'est pas responsable des dommages indirects, accessoires ou consécutifs liés à l'utilisation de l'App. La responsabilité totale n'excédera pas le montant payé pour l'App au cours des 12 derniers mois.`],
 ["9. Modifications et résiliation", `Nous pouvons mettre à jour l'App ou ces Conditions à tout moment ; continuer à l'utiliser vaut acceptation. Nous pouvons suspendre l'accès en cas de violation.`],
 ["10. Droit applicable et contact", `Ces Conditions sont régies par le droit vietnamien, sans préjudice des protections impératives des consommateurs de votre pays. Contact : ${EMAIL}`]]},
de: { name:"Deutsch", title:"Nutzungsbedingungen", updated:"Zuletzt aktualisiert", privacy:"Datenschutzerklärung", s:[
 ["1. Zustimmung", `Mit dem Herunterladen oder Nutzen von ${APP} („die App“), entwickelt von Ly Truong, stimmen Sie diesen Bedingungen zu. Andernfalls nutzen Sie die App bitte nicht.`],
 ["2. Lizenz", `Wir gewähren Ihnen eine persönliche, nicht exklusive, nicht übertragbare und widerrufliche Lizenz zur Nutzung der App auf Geräten, die Sie besitzen oder kontrollieren, für persönliche, nicht kommerzielle Zwecke gemäß den Bedingungen des App Store bzw. Google Play.`],
 ["3. In-App-Kauf", `„Werbung entfernen“ ist ein einmaliger, nicht verbrauchbarer Kauf, der alle Werbung entfernt und alle Torten freischaltet. Er wird von Apple oder Google nach deren Bedingungen abgewickelt; Rückerstattungen erfolgen über diese. Auf anderen Geräten mit demselben Store-Konto kann er über „Käufe wiederherstellen“ wiederhergestellt werden.`],
 ["4. Werbung und Rewarded Ads", `Die kostenlose Version zeigt Werbung von Google AdMob. Einige Torten können durch Ansehen einer Rewarded-Werbung genutzt werden; die Torte bleibt freigeschaltet, solange sie ausgewählt ist, und wird beim Wechsel wieder gesperrt. Die Verfügbarkeit von Werbung ist nicht garantiert.`],
 ["5. Zulässige Nutzung", `Sie dürfen die App oder ihre Inhalte nicht kopieren, verändern, verbreiten, zurückentwickeln oder weiterverkaufen, rechtswidrig nutzen oder in Werbe- und Kaufmechanismen eingreifen.`],
 ["6. Inhalte und geistiges Eigentum", `Die App, ihre Grafiken, Tortendesigns, Schriften und Musik gehören Ly Truong oder sind lizenziert. Eingegebene Namen bleiben Ihr Eigentum und auf Ihrem Gerät.`],
 ["7. Gewährleistungsausschluss", `Die App wird „wie besehen“ und „wie verfügbar“ ohne jegliche Gewährleistung bereitgestellt. Die Erkennung des Ausblasens hängt von Mikrofon und Umgebung ab und funktioniert nicht immer wie erwartet.`],
 ["8. Haftungsbeschränkung", `Soweit gesetzlich zulässig haftet Ly Truong nicht für indirekte, zufällige oder Folgeschäden aus der Nutzung der App. Die Gesamthaftung übersteigt nicht den in den letzten 12 Monaten für die App gezahlten Betrag.`],
 ["9. Änderungen und Beendigung", `Wir können die App oder diese Bedingungen jederzeit aktualisieren; die weitere Nutzung gilt als Zustimmung. Bei Verstößen können wir den Zugang sperren.`],
 ["10. Anwendbares Recht und Kontakt", `Es gilt vietnamesisches Recht, unbeschadet zwingender Verbraucherschutzrechte Ihres Landes. Kontakt: ${EMAIL}`]]},
ru: { name:"Русский", title:"Условия использования", updated:"Обновлено", privacy:"Политика конфиденциальности", s:[
 ["1. Принятие", `Загружая или используя ${APP} («Приложение»), разработанное Ly Truong, вы соглашаетесь с настоящими Условиями. Если вы не согласны, не используйте Приложение.`],
 ["2. Лицензия", `Мы предоставляем вам личную, неисключительную, непередаваемую и отзывную лицензию на использование Приложения на принадлежащих вам устройствах в личных некоммерческих целях в соответствии с условиями App Store или Google Play.`],
 ["3. Покупка в приложении", `«Убрать рекламу» — разовая непотребляемая покупка, отключающая всю рекламу и открывающая все торты. Её обрабатывают Apple или Google по своим условиям; возвраты — через них. Восстановить можно на других устройствах с тем же аккаунтом через «Восстановить покупки».`],
 ["4. Реклама и реклама с вознаграждением", `Бесплатная версия показывает рекламу Google AdMob. Некоторые торты можно использовать, посмотрев рекламу с вознаграждением; торт остаётся открытым, пока выбран, и закрывается при переключении. Доступность рекламы не гарантируется.`],
 ["5. Допустимое использование", `Запрещается копировать, изменять, распространять, декомпилировать или перепродавать Приложение и его контент, использовать его незаконно или вмешиваться в механизмы рекламы и покупок.`],
 ["6. Контент и интеллектуальная собственность", `Приложение, графика, дизайны тортов, шрифты и музыка принадлежат Ly Truong или лицензированы. Введённые имена остаются вашими и хранятся на устройстве.`],
 ["7. Отказ от гарантий", `Приложение предоставляется «как есть» без каких-либо гарантий. Распознавание выдоха зависит от микрофона и окружения и может работать не всегда.`],
 ["8. Ограничение ответственности", `В пределах, допускаемых законом, Ly Truong не несёт ответственности за косвенные, случайные или последующие убытки. Общая ответственность не превышает сумму, уплаченную за Приложение за последние 12 месяцев.`],
 ["9. Изменения и прекращение", `Мы можем обновлять Приложение или Условия в любое время; продолжение использования означает согласие. При нарушении доступ может быть приостановлен.`],
 ["10. Применимое право и контакты", `Условия регулируются законодательством Вьетнама без ущерба для обязательных норм защиты потребителей вашей страны. Контакт: ${EMAIL}`]]},
id: { name:"Bahasa Indonesia", title:"Ketentuan Penggunaan", updated:"Terakhir diperbarui", privacy:"Kebijakan Privasi", s:[
 ["1. Penerimaan", `Dengan mengunduh atau menggunakan ${APP} ("Aplikasi") yang dikembangkan Ly Truong, Anda menyetujui Ketentuan ini. Jika tidak setuju, jangan gunakan Aplikasi.`],
 ["2. Lisensi", `Kami memberi Anda lisensi pribadi, non-eksklusif, tidak dapat dipindahtangankan, dan dapat dicabut untuk menggunakan Aplikasi di perangkat milik Anda untuk tujuan pribadi non-komersial sesuai ketentuan App Store atau Google Play.`],
 ["3. Pembelian dalam aplikasi", `"Hapus Iklan" adalah pembelian sekali bayar non-konsumsi yang menghapus semua iklan dan membuka semua kue. Diproses oleh Apple atau Google sesuai ketentuan mereka; pengembalian dana ditangani mereka. Dapat dipulihkan di perangkat lain dengan akun yang sama lewat "Pulihkan pembelian".`],
 ["4. Iklan dan iklan berhadiah", `Versi gratis menampilkan iklan Google AdMob. Beberapa kue dapat dipakai dengan menonton iklan berhadiah; kue tetap terbuka selama dipilih dan terkunci lagi saat Anda berganti kue. Ketersediaan iklan tidak dijamin.`],
 ["5. Penggunaan yang wajar", `Anda tidak boleh menyalin, mengubah, mendistribusikan, merekayasa balik, atau menjual kembali Aplikasi atau kontennya, menggunakannya secara ilegal, atau mengganggu mekanisme iklan dan pembelian.`],
 ["6. Konten dan kekayaan intelektual", `Aplikasi, karya seni, desain kue, font, dan musik dimiliki atau dilisensikan kepada Ly Truong. Nama yang Anda masukkan tetap milik Anda dan tersimpan di perangkat.`],
 ["7. Penafian", `Aplikasi disediakan "sebagaimana adanya" tanpa jaminan apa pun. Deteksi tiupan bergantung pada mikrofon dan lingkungan sehingga mungkin tidak selalu berfungsi seperti yang diharapkan.`],
 ["8. Batasan tanggung jawab", `Sejauh diizinkan hukum, Ly Truong tidak bertanggung jawab atas kerugian tidak langsung, insidental, atau konsekuensial dari penggunaan Aplikasi. Total tanggung jawab tidak melebihi jumlah yang Anda bayar dalam 12 bulan terakhir.`],
 ["9. Perubahan dan penghentian", `Kami dapat memperbarui Aplikasi atau Ketentuan ini kapan saja; penggunaan berlanjut berarti menerima. Kami dapat menangguhkan akses jika Anda melanggar Ketentuan.`],
 ["10. Hukum yang berlaku dan kontak", `Ketentuan ini diatur oleh hukum Vietnam tanpa mengurangi perlindungan konsumen wajib di negara Anda. Kontak: ${EMAIL}`]]},
th: { name:"ไทย", title:"ข้อกำหนดการใช้งาน", updated:"อัปเดตล่าสุด", privacy:"นโยบายความเป็นส่วนตัว", s:[
 ["1. การยอมรับ", `การดาวน์โหลดหรือใช้ ${APP} ("แอป") ที่พัฒนาโดย Ly Truong ถือว่าคุณยอมรับข้อกำหนดนี้ หากไม่ยอมรับ โปรดอย่าใช้แอป`],
 ["2. สิทธิ์การใช้งาน", `เราให้สิทธิ์ส่วนบุคคล ไม่ผูกขาด ไม่สามารถถ่ายโอน และเพิกถอนได้ ในการใช้แอปบนอุปกรณ์ที่คุณเป็นเจ้าของหรือควบคุม เพื่อวัตถุประสงค์ส่วนตัวที่ไม่ใช่เชิงพาณิชย์ ตามข้อกำหนดของ App Store หรือ Google Play`],
 ["3. การซื้อในแอป", `"ลบโฆษณา" เป็นการซื้อครั้งเดียวแบบไม่สิ้นเปลือง ลบโฆษณาทั้งหมดและปลดล็อกเค้กทุกแบบ ดำเนินการโดย Apple หรือ Google ตามข้อกำหนดของพวกเขา การคืนเงินจัดการโดยพวกเขา สามารถกู้คืนบนอุปกรณ์อื่นที่ใช้บัญชีเดียวกันด้วย "กู้คืนการซื้อ"`],
 ["4. โฆษณาและโฆษณาแบบมีรางวัล", `เวอร์ชันฟรีแสดงโฆษณาจาก Google AdMob เค้กบางแบบใช้ได้โดยดูโฆษณาแบบมีรางวัล เค้กจะปลดล็อกขณะถูกเลือกและล็อกอีกครั้งเมื่อเปลี่ยนไปใช้แบบอื่น ไม่รับประกันว่าจะมีโฆษณาเสมอ`],
 ["5. การใช้งานที่ยอมรับได้", `ห้ามคัดลอก แก้ไข แจกจ่าย ทำวิศวกรรมย้อนกลับ หรือขายต่อแอปหรือเนื้อหา ห้ามใช้ในทางที่ผิดกฎหมาย หรือแทรกแซงกลไกโฆษณาและการซื้อ`],
 ["6. เนื้อหาและทรัพย์สินทางปัญญา", `แอป ภาพ ดีไซน์เค้ก ฟอนต์ และเพลง เป็นของ Ly Truong หรือได้รับอนุญาต ชื่อที่คุณกรอกเป็นของคุณและอยู่ในอุปกรณ์ของคุณ`],
 ["7. ข้อจำกัดความรับผิดชอบ", `แอปให้บริการ "ตามที่เป็น" โดยไม่มีการรับประกันใด ๆ การตรวจจับการเป่าเทียนขึ้นอยู่กับไมโครโฟนและสภาพแวดล้อม อาจไม่ทำงานตามที่คาดหวังเสมอ`],
 ["8. ข้อจำกัดความรับผิด", `ภายในขอบเขตที่กฎหมายอนุญาต Ly Truong ไม่รับผิดต่อความเสียหายทางอ้อม อุบัติเหตุ หรือผลสืบเนื่องจากการใช้แอป ความรับผิดรวมไม่เกินจำนวนที่คุณจ่ายสำหรับแอปใน 12 เดือนล่าสุด`],
 ["9. การเปลี่ยนแปลงและการยุติ", `เราอาจอัปเดตแอปหรือข้อกำหนดได้ทุกเมื่อ การใช้งานต่อถือว่ายอมรับ เราอาจระงับการเข้าถึงหากคุณละเมิดข้อกำหนด`],
 ["10. กฎหมายที่ใช้บังคับและการติดต่อ", `ข้อกำหนดนี้อยู่ภายใต้กฎหมายเวียดนาม โดยไม่กระทบสิทธิ์คุ้มครองผู้บริโภคตามกฎหมายในประเทศของคุณ ติดต่อ: ${EMAIL}`]]},
};
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  const cands = [q, ...(navigator.languages || [navigator.language])].filter(Boolean);
  for (const c of cands) { const k = c.toLowerCase().split(/[-_]/)[0]; if (T[k]) return k; }
  return "en";
}
function render(k) {
  const t = T[k]; document.documentElement.lang = k;
  document.documentElement.dir = ["ar","he","fa","ur"].includes(k) ? "rtl" : "ltr";
  document.title = t.title + " – " + APP;
  document.getElementById("title").textContent = t.title;
  document.getElementById("meta").textContent = `${APP} · ${t.updated}: ${UPDATED}`;
  document.getElementById("privacy-link").textContent = t.privacy;
  document.getElementById("privacy-link").href = "privacy.html?lang=" + k;
  document.getElementById("content").innerHTML = t.s.map(([h,p]) => `<section><h2>${h}</h2><p>${p}</p></section>`).join("");
  document.getElementById("lang").value = k;
}
const sel = document.getElementById("lang");
for (const k of Object.keys(T)) { const o = document.createElement("option"); o.value = k; o.textContent = T[k].name; sel.appendChild(o); }
sel.addEventListener("change", e => { render(e.target.value); history.replaceState(null, "", "?lang=" + e.target.value); });
render(pickLang());
</script>
</body>
</html>
